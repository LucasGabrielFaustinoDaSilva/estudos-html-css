<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Textos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .itens {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .item {
            background: white;
            border: 1px solid #ddd;
            width: 200px;
            padding: 15px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }
        .item h2 {
            margin-top: 0;
            color: #444;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Meus Itens</h1>
    
    <div class="itens">
        <div class="item">
            <h2>Item 1</h2>
            <p>Descrição breve do primeiro item da lista.</p>
        </div>
        <div class="item">
            <h2>Item 2</h2>
            <p>Descrição breve do segundo item da lista.</p>
        </div>
        <div class="item">
            <h2>Item 3</h2>
            <p>Descrição breve do terceiro item da lista.</p>
        </div>
        <div class="item">
            <h2>Item 4</h2>
            <p>Descrição breve do quarto item da lista.</p>
        </div>
    </div>
</body>
</html>
