<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de formulario</title>
  <style>
    
  </style>
</head>
<body>
  <h1>Teste de formulario</h1>
  <form action="cadastro.php" method="post" autocomplete="on">
    <p>
      <label for="iusu">Usuario:</label>
      <input type="text" name="usu" id="iusu" required maxlength="20" size="20" placeholder="nome do usuario" autocomplete="username"><!--Required serve para dados obrigatorios size é para taa=manho da caixa-->
    </p>
    <p>
      <label for="isenha">Senha:</label>
      <input type="password" name="senha" id="isenha" required minlength="6" size="8" placeholder="senha" autocomplete="current-password" >
      <input type="submit" value="enviar">
      <input type="reset" value="limpar">
    </p>

  </form>
</body>
</html>
