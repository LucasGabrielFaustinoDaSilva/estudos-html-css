<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
</head>
<body>
  <h1>Exemplo de formulário</h1>
  <form action="cadastro.php" method="get">
    <!--Para não marcar dois no sexo usando radio usamos o mesmo name tanto para masculino quanto para femino-->
    <fieldset>
      <legend>Sexo</legend>
      <input type="radio" name="sexo" id="isxmas"><label for="isxmas">Masculino</label>
      <input type="radio" name="sexo" id="isxfem" checked><label for="isxfem"  >Feminino</label>
    </fieldset>
    <fieldset>
      <legend>Esporte favortito</legend>
      <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
      <input type="checkbox" name="nat" id="inat"><label for="inat">Natação</label> <br>
      <input type="checkbox" name="bas" id="ibas"><label for="ibas">Basquete</label> <br>
    </fieldset>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Apagar">
    </p>
  </form>
</body>
</html>
