<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste de formulario</title>
  </head>
  <body>
    <h1>Teste de formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
      <p>
        <label for="inome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="inome"
          required
          maxlength="30"
          placeholder="nome completo"
          autocomplete="name"
        />
      </p>
      <p>
        <label for="imedia">Media:</label>
        <input
          type="number"
          name="media"
          id="imedia"
          max="10"
          min="0"
          placeholder="0 a 10"
          required
          step="0.01"
          value="5"
        />
        <!--step serve para definir numeros com virgulas-->
      </p>
      <p>
        <label for="imes">Periodo letivo:</label>
        <input 
        type="month" 
        name="mes" 
        id="imes" 
        value="2020-07"
        />
      </p>
      <p>
        <label for="idia">dia da prova:</label>
        <input type="date" name="dia" id="idia" required value="2025-01-12">
      </p>
      <p>
        <label for="ihora">Hora da prova:</label>
        <input type="time" name="hora" id="ihora">
      </p>
      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Apagar" />
      </p>
    </form>
  </body>
</html>
