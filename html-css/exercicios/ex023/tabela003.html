<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        width: 200px;
        border-collapse: collapse;

      }
      td {
        padding: 10px;
        border: 1px solid black;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Mesclagem de céculas</h1>

    <table>
      <tr>
        <td>A</td>
        <td colspan="2">B</td> <!--Para ocupar duas colunas, usa quando não quer deixar espaço vazio-->
        
      </tr>
      <tr>
        <td rowspan="3">D</td>  <!--Para ocupar tres linhas, usa quando não quer deixar espaço vazio-->
        <td>E</td>
        <td>F</td>
      </tr>
      <tr>
       
        <td>H</td>
        <td>I</td>
      </tr>
      <tr>
        
        <td>K</td>
        <td>L</td>
      </tr>
    </table>
  </body>
</html>
